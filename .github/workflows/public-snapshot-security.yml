name: Public partner snapshot security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_public_snapshot.py
      - name: Block accidental private files and public data without approval
        run: |
          test ! -e .streamlit/secrets.toml
          test ! -e .env
          test ! -d public_partner_data
